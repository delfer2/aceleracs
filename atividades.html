<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Textos de Atividades - CS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="auth.js"></script>
    <!-- Font Inter para copiar fielmente a tipografia do app -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
      }

      body {
        background-color: #f1f2f7;
        display: flex;
        min-height: 100vh;
        color: #1a1d24;
      }

      /* --- CONTEÚDO DO DASHBOARD --- */
      .main-content {
        margin-left: 250px;
        flex: 1;
        width: calc(100% - 250px);
        padding: 40px 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .container {
        width: 100%;
        max-width: 900px;
      }

      .page-title {
        color: #1a1d24;
        font-size: 1.6rem;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: -0.5px;
      }

      .subtitle {
        color: #9499a6;
        margin-bottom: 25px;
        font-size: 0.95rem;
      }

      /* --- SELETOR DE ABAS ESTILO DASHBOARD --- */
      .plan-selector-container {
        display: flex;
        margin: 20px 0;
        background: #e4e6f1;
        padding: 4px;
        border-radius: 12px;
        width: fit-content;
      }

      .plan-btn {
        padding: 8px 20px;
        border: none;
        background: transparent;
        font-size: 0.85rem;
        font-weight: 700;
        color: #727785;
        cursor: pointer;
        border-radius: 9px;
        transition: all 0.2s ease;
      }

      .plan-btn.active {
        background: #6226ef;
        color: #ffff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      .date-badge {
        background-color: #fff;
        color: #6226ef;
        border: 1px solid #e4e6f1;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 600;
        display: inline-block;
        margin-bottom: 20px;
        font-size: 0.85rem;
      }

      /* --- CARDS ESTILO DESIGN OS --- */
      .activity-card {
        background: #ffffff;
        border: 1px solid #e4e6f1;
        border-radius: 16px;
        margin-bottom: 14px;
        overflow: hidden;
        transition: all 0.2s ease;
      }

      .activity-card:hover {
        border-color: #cbcedb;
        box-shadow: 0 4px 20px rgba(98, 38, 239, 0.03);
      }

      .card-header {
        padding: 20px 24px;
        background: #ffffff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        user-select: none;
      }

      .card-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #1a1d24;
      }

      .card-toggle-icon {
        color: #9499a6;
        font-size: 0.75rem;
        transition: transform 0.2s;
      }

      .card-body {
        padding: 0 24px;
        max-height: 0;
        overflow: hidden;
        transition: all 0.25s ease-out;
        background: #ffffff;
      }

      .activity-card.open {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
      }

      .activity-card.open .card-body {
        padding: 0 24px 24px 24px;
        max-height: 2500px;
      }

      .activity-card.open .card-toggle-icon {
        transform: rotate(180deg);
      }

      /* --- SEÇÕES INTERNAS DO CARD --- */
      .topic-container {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #f1f2f7;
      }

      .topic-container:first-child {
        border-top: none;
        margin-top: 8px;
        padding-top: 0;
      }

      .topic-title {
        font-size: 0.75rem;
        font-weight: 700;
        color: #6226ef;
        background: #f3f0ff;
        padding: 4px 10px;
        border-radius: 6px;
        width: fit-content;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .text-preview-box {
        background: #fafafc;
        border: 1px solid #e4e6f1;
        border-radius: 12px;
        padding: 18px;
        color: #444957;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 14px;
        white-space: pre-wrap;
      }

      .text-preview-box strong {
        color: #6226ef;
        background: #f3f0ff;
        padding: 2px 6px;
        border-radius: 6px;
        font-weight: 600;
      }

      .btn-copy {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: #6226ef;
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s ease;
        position: relative;
        gap: 8px;
      }

      .btn-copy:hover {
        background-color: #4919be;
        box-shadow: 0 4px 12px rgba(98, 38, 239, 0.2);
      }

      .tooltip-text {
        visibility: hidden;
        background-color: #1a1d24;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 6px 12px;
        position: absolute;
        z-index: 10;
        bottom: 125%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.15s;
        font-size: 0.75rem;
        white-space: nowrap;
        font-weight: normal;
      }

      .btn-copy.copied .tooltip-text {
        visibility: visible;
        opacity: 1;
      }
    </style>

      function mudarPlano(tipo) {
        planoAtual = tipo;
        document
          .getElementById('btnPos')
          .classList.toggle('active', tipo === 'pos');
        document
          .getElementById('btnPre')
          .classList.toggle('active', tipo === 'pre');
        inicializarTela();
      }

      function obterDataDeHoje() {
        const hoje = new Date();
        const dia = String(hoje.getDate()).padStart(2, '0');
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const ano = hoje.getFullYear();
        return `${dia}/${mes}/${ano}`;
      }

      function toggleCard(cardElement) {
        cardElement.classList.toggle('open');
      }

      function copiarTextoAtividade(btn, textoBase) {
        const dataHoje = obterDataDeHoje();
        const textoFinal = textoBase.replace(/\[DATA\]/g, dataHoje);
        navigator.clipboard
          .writeText(textoFinal)
          .then(() => {
            btn.classList.add('copied');
            setTimeout(() => {
              btn.classList.remove('copied');
            }, 1200);
          })
          .catch((err) => console.error('Erro ao copiar: ', err));
      }

      function inicializarTela() {
        const dataHoje = obterDataDeHoje();
        document.getElementById(
          'currentDateBadge'
        ).textContent = `Hoje é: ${dataHoje}`;

        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';

        const listaAtividades =
          planoAtual === 'pos' ? listaAtividadesPos : listaAtividadesPre;

        listaAtividades.forEach((ativ, indexAtiv) => {
          const card = document.createElement('div');
          card.className = 'activity-card';

          const header = document.createElement('div');
          header.className = 'card-header';
          header.onclick = function () {
            toggleCard(card);
          };
          header.innerHTML = `
                <span class="card-title">${ativ.titulo}</span>
                <span class="card-toggle-icon">▼</span>
            `;
          card.appendChild(header);

          const body = document.createElement('div');
          body.className = 'card-body';

          ativ.topicos.forEach((topico) => {
            const topicContainer = document.createElement('div');
            topicContainer.className = 'topic-container';

            if (ativ.topicos.length > 1) {
              const title = document.createElement('div');
              title.className = 'topic-title';
              title.textContent = `📌 ${topico.subtitulo}`;
              topicContainer.appendChild(title);
            }

            const previewBox = document.createElement('div');
            previewBox.className = 'text-preview-box';
            previewBox.innerHTML = topico.texto.replace(
              /\[DATA\]/g,
              `<strong>${dataHoje}</strong>`
            );
            topicContainer.appendChild(previewBox);

            const btn = document.createElement('button');
            btn.className = 'btn-copy';
            btn.onclick = function () {
              copiarTextoAtividade(this, topico.texto);
            };
            btn.innerHTML = `📋 Copiar Registro <span class="tooltip-text">Texto Copiado!</span>`;
            topicContainer.appendChild(btn);

            body.appendChild(topicContainer);
          });

          card.appendChild(body);
          container.appendChild(card);
        });
      }

      window.onload = inicializarTela;
